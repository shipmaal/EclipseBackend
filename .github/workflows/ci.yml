name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # Fast job: lint + the pure-function tests. The numerical-validation tests need
  # SPICE kernels and skip cleanly without them, so this runs with no downloads.
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: uv sync
      - name: Ruff (lint)
        run: uv run ruff check .
      - name: Pure-function tests (kernels auto-skip)
        run: uv run pytest -q

  # Full job: download the pinned GitHub-mirror kernels (DE432s + IAU_EARTH) and
  # run the reference-eclipse validation end to end.
  full-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: uv sync
      - name: Download SPICE kernels (GitHub mirror)
        run: uv run python -m kernels.bootstrap --source mirror
      - name: Full validation (reference eclipses)
        run: uv run pytest -q
