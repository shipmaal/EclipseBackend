[project]
name = "eclipsebackend"
version = "0.1.0"
description = "Solar eclipse visualizer backend (SPICE / JPL DE440 ephemeris)"
authors = [{ name = "Alan Shipman", email = "shipmaal@bc.edu" }]
requires-python = ">=3.10,<3.13"
readme = "README.md"

# Core runtime. The ephemeris engine is SPICE (SpiceyPy + JPL DE440);
# astropy / basemap are intentionally gone.
dependencies = [
    "spiceypy>=6.0.0",
    "numpy>=1.26,<2.1",
    "pandas>=2.2",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "gunicorn>=22.0",
    "requests>=2.31",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
# Plotting is a dev/offline concern, not part of the request path.
viz = ["matplotlib>=3.8"]

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
