[project]
name = "eclipsebackend"
version = "0.1.0"
description = "Solar eclipse backend: a C++ core (CSPICE + ERFA, JPL DE ephemeris) behind a FastAPI API"
authors = [{ name = "Alan Shipman", email = "shipmaal@bc.edu" }]
requires-python = ">=3.10,<3.13"
readme = "README.md"

# Runtime. Every number comes from the native core `_eclipse` (built from this
# project: vendored CSPICE + ERFA); the IERS EOP file comes from
# astropy-iers-data, and `requests` serves kernels/bootstrap.py.
dependencies = [
    "astropy-iers-data>=0.2024.1.1.0.0.0",
    "numpy>=1.26,<2.1",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "gunicorn>=22.0",
    "requests>=2.31",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
# Plotting is a dev/offline concern, not part of the request path.
viz = ["matplotlib>=3.8"]

[dependency-groups]
# nanobind here too so `cmake --preset release` (Catch2 tests) finds it in .venv.
# spiceypy / pyerfa: the tests' independent references (the 3D limb oracle, the
# raw SPICE calls), a separate CSPICE / ERFA build from the core's; pandas
# reads the reference central-line table (tests/reference.py).
dev = [
    "pytest>=8.0", "ruff>=0.6", "httpx>=0.27", "nanobind>=2.0",
    "spiceypy>=6.0.0", "pyerfa>=2.0.0", "pandas>=2.2",
]

[build-system]
# The native core (libeclipse: vendored CSPICE + ERFA, nanobind) is built by
# scikit-build-core from CMakeLists.txt; `uv sync` builds it into .venv as the
# `_eclipse` extension. Needs a C/C++ compiler and CMake >= 3.20 (Ninja comes
# from PyPI if absent). See docs/CPP_NATIVE.md.
requires = ["scikit-build-core>=0.10", "nanobind>=2.0"]
build-backend = "scikit_build_core.build"

[tool.uv]
# Rebuild the native core on `uv sync` when any of its inputs change (uv's
# default only watches pyproject.toml).
cache-keys = [
  { file = "pyproject.toml" },
  { file = "CMakeLists.txt" },
  { file = "cmake/**" },
  { file = "core/**" },
  { file = "bindings/**" },
  { file = "third_party/**" },
]

[tool.scikit-build]
minimum-version = "build-system.requires"
build-dir = "build/{wheel_tag}"     # keep the CSPICE objects between rebuilds
cmake.build-type = "Release"
wheel.packages = []                 # the wheel carries only the `_eclipse` extension;
                                    # `app/` stays a source tree on PYTHONPATH

[tool.scikit-build.cmake.define]
ECLIPSE_BUILD_PYTHON = "ON"
ECLIPSE_BUILD_TESTS = "OFF"         # Catch2 tests: `cmake --preset release && ctest --preset release`

[tool.ruff]
line-length = 100
target-version = "py310"
# Vendored / non-project sources (C SPICE stubs, Fortran ELP2000 helpers).
extend-exclude = ["c_src", "f_src"]

[tool.ruff.lint]
# pyflakes (F), pycodestyle errors/warnings (E, W), import sort (I),
# pyupgrade (UP) and a few bugbear (B) checks.
select = ["E", "F", "W", "I", "UP", "B"]
# 'l', 'l1', 'l2' are the standard Besselian symbols for the shadow-cone radii,
# so keep the ambiguous-name rule off for this scientific notation.
ignore = ["E741"]

[tool.ruff.lint.per-file-ignores]
# Reference-eclipse data dicts are kept as single readable lines.
"tests/test_besselian_integration.py" = ["E501"]
"tests/test_catalog.py" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
