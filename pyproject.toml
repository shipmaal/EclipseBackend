[project]
name = "eclipsebackend"
version = "0.1.0"
description = "Solar eclipse visualizer backend (SPICE / JPL DE440 ephemeris)"
authors = [{ name = "Alan Shipman", email = "shipmaal@bc.edu" }]
requires-python = ">=3.10,<3.13"
readme = "README.md"

# Core runtime. The ephemeris engine is SPICE (SpiceyPy + JPL DE440);
# astropy / basemap are intentionally gone.
dependencies = [
    "spiceypy>=6.0.0",
    "pyerfa>=2.0.0",
    "astropy-iers-data>=0.2024.1.1.0.0.0",
    "numpy>=1.26,<2.1",
    "pandas>=2.2",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "gunicorn>=22.0",
    "requests>=2.31",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
# Plotting is a dev/offline concern, not part of the request path.
viz = ["matplotlib>=3.8"]

[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.6"]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py310"
# Vendored / non-project sources (C SPICE stubs, Fortran ELP2000 helpers).
extend-exclude = ["c_src", "f_src"]

[tool.ruff.lint]
# pyflakes (F), pycodestyle errors/warnings (E, W), import sort (I),
# pyupgrade (UP) and a few bugbear (B) checks.
select = ["E", "F", "W", "I", "UP", "B"]
# 'l', 'l1', 'l2' are the standard Besselian symbols for the shadow-cone radii,
# so keep the ambiguous-name rule off for this scientific notation.
ignore = ["E741"]

[tool.ruff.lint.per-file-ignores]
# Reference-eclipse data dicts are kept as single readable lines.
"tests/test_besselian_integration.py" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
